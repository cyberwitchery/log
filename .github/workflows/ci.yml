name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install ruff==0.15.22
      - run: ruff check .
      - run: ruff format --check .

  frontmatter:
    name: frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: validate post frontmatter
        run: |
          python -c "
          import yaml, re, glob, sys
          FM = re.compile(r'\A---\s*\n(.*?)\n---\s*\n', re.DOTALL)
          ok = True
          for f in sorted(glob.glob('posts/*.md')):
              text = open(f).read()
              m = FM.match(text)
              if not m:
                  print(f'{f}: missing frontmatter'); ok = False; continue
              try:
                  meta = yaml.safe_load(m.group(1))
                  required = ('title', 'date', 'author')
                  missing = [field for field in required if not meta.get(field)]
                  assert not missing, 'missing required fields: ' + ', '.join(missing)
                  assert isinstance(meta['author'], str), 'author must be a string'
              except Exception as e:
                  print(f'{f}: {e}'); ok = False
          sys.exit(0 if ok else 1)
          "

  success:
    name: success
    needs: [lint, frontmatter]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: check results
        # skipped counts as failure: every job in needs runs unconditionally,
        # so a skip only ever means an upstream job broke.
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            exit 1
          fi
