# resolve the imported fabric into emit-ready IR for every adapter:
#
#   alembic map -f ir.json --spec resolve.yaml -o resolved.json
#

transforms:
  file: ./transforms.star
schema:
  types:
    dcim.device:
      key:
        primary_ip: { type: string }
      fields:
        name: { type: slug }
        role: { type: string }
        site: { type: string }
        platform: { type: string }
        kind: { type: string }
        primary_ip: { type: string }
        asset_tag: { type: string }
        ansible_network_os: { type: string }
        id: { type: int }
        bgp_as: { type: string }
        mgmt_ip: { type: string }
    dcim.interface:
      key:
        device: { type: ref, target: dcim.device }
        name: { type: string }
      fields:
        name: { type: string }
        device: { type: ref, target: dcim.device }
    dcim.cable:
      key: { label: { type: string } }
      fields:
        label: { type: string }
        a_terminations: { type: list_ref, target: dcim.interface }
        b_terminations: { type: list_ref, target: dcim.interface }
rules:
  - name: devices
    match: "dcim.device"
    lookups:
      role: { ref: "${attrs.role}", get: "key.slug" }
      site: { ref: "${attrs.site}", get: "key.slug" }
      platform: { ref: "${attrs.platform}", get: "key.slug" }
      ip: { ref: "${attrs.primary_ip4}", get: "attrs.address" }
    emit:
      type: dcim.device
      key:
        primary_ip: "${lookup.ip|cidr_host}"
      attrs:
        name: "${attrs.name}"
        role: "${lookup.role}"
        site: "${lookup.site}"
        platform: "${lookup.platform}"
        kind: "${lookup.platform|clab_kind}"
        primary_ip: "${lookup.ip|cidr_host}"
        asset_tag: "${attrs.asset_tag}"
        ansible_network_os: "${lookup.platform|ansible_os}"
        id: "${attrs.name|avd_id}"
        bgp_as: "${attrs.name|avd_bgp_as}"
        mgmt_ip: "${lookup.ip}"
